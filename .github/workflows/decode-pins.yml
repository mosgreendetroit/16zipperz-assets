name: Decode pin images

on:
  push:
    paths:
      - "pins_b64/**"
      - ".github/workflows/decode-pins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode base64 pins
        run: |
          set -euo pipefail
          mkdir -p pins
          for f in pins_b64/*.png.b64; do
            [ -e "$f" ] || continue
            out="pins/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            file "$out"
          done

      - name: Commit decoded images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pins/
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add decoded marketing pin PNGs"
            git push
          fi
